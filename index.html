<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yeonsu Kim | Product Designer Portfolio" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Yeonsu Kim | Product Designer Portfolio</title>

    <!-- 링크를 공유할 때(카톡·슬랙·SNS 등) 나오는 미리보기. 사이트 주소가 바뀌면 아래 og:url, og:image 주소도 새 주소로 바꿔주세요. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yeonsu Kim | Product Designer Portfolio" />
    <meta property="og:description" content="Yeonsu Kim | Product Designer Portfolio" />
    <meta property="og:url" content="https://cooki7101-pixel.github.io/myportfolio/" />
    <meta property="og:image" content="https://cooki7101-pixel.github.io/myportfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yeonsu Kim | Product Designer Portfolio" />
    <meta name="twitter:image" content="https://cooki7101-pixel.github.io/myportfolio/og-image.png" />

    <!-- 로딩스크린(.loading-screen, 배경 #c9d2e7)이 React로 마운트되기 전,
         외부 CSS(global.css)가 body 배경을 --color-background(#f5f5f2,
         베이지색)로 칠하는 순간이 아주 잠깐 먼저 보였습니다 — 그 틈을
         없애려고 외부 CSS/JS를 기다리지 않는 인라인 스타일로 처음부터
         로딩스크린과 같은 색을 깔아둡니다. -->
    <style>
      html,
      body {
        background: #c9d2e7;
      }
      /* JS가 로드되기 전에도 로딩 화면과 같은 "0%"를 먼저 보여줍니다 */
      #boot-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2001;
        background: #c9d2e7;
      }
      #boot-loading p {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: max-content;
        margin: 0;
        color: #333;
        font-family: "Neue Machina", sans-serif;
        font-size: 80px;
        line-height: 1.05;
        text-align: center;
      }
      @media (max-width: 721px) {
        #boot-loading p {
          font-size: 40px;
        }
      }
    </style>

    <!-- Google Analytics 4 — analytics.google.com에서 속성을 만들고 받은
         측정 ID(G-BD7201ME4Y)로 아래 두 군데(src, gtag 호출)를 바꿔주세요.
         체류시간, 방문자 수, 유입경로 등은 GA4 리포트(참여도 > 참여 시간)에서
         자동으로 볼 수 있어서 별도 코드가 더 필요하지 않습니다. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-BD7201ME4Y"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-BD7201ME4Y");
    </script>
  </head>
  <body>
    <div id="boot-loading"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
