<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UX/UI Portfolio Starter Kit" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Portfolio Starter Kit</title>

    <!-- 로딩스크린(.loading-screen, 배경 #c9d2e7)이 React로 마운트되기 전,
         외부 CSS(global.css)가 body 배경을 --color-background(#f5f5f2,
         베이지색)로 칠하는 순간이 아주 잠깐 먼저 보였습니다 — 그 틈을
         없애려고 외부 CSS/JS를 기다리지 않는 인라인 스타일로 처음부터
         로딩스크린과 같은 색을 깔아둡니다. -->
    <style>
      html,
      body {
        background: #c9d2e7;
      }
    </style>

    <!-- Google Analytics 4 — analytics.google.com에서 속성을 만들고 받은
         측정 ID(G-XXXXXXXXXX)로 아래 두 군데(src, gtag 호출)를 바꿔주세요.
         체류시간, 방문자 수, 유입경로 등은 GA4 리포트(참여도 > 참여 시간)에서
         자동으로 볼 수 있어서 별도 코드가 더 필요하지 않습니다. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XXXXXXXXXX");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
